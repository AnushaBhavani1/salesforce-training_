<template>
    <lightning-card title="Student Profile">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Student Name"
                value={studentName}
                data-field="studentName"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Email"
                type="email"
                value={email}
                data-field="email"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Phone"
                type="tel"
                value={phone}
                data-field="phone"
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                label="CGPA"
                type="number"
                step="0.01"
                value={cgpa}
                data-field="cgpa"
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Branch"
                value={branch}
                data-field="branch"
                onchange={handleChange}
                required>
            </lightning-input>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="Save Profile"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>
</template>
