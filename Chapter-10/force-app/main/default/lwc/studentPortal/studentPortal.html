<template>
    <lightning-card title="Student Placement Portal">

        <div class="slds-p-around_medium">

            <h2 class="slds-text-heading_medium">
                Welcome to Student Placement Portal
            </h2>

            <template if:true={applicationSuccess}>
                <div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_medium">
                    Application submitted successfully!
                </div>
            </template>

            <c-student-profile>
            </c-student-profile>

            <div class="slds-m-top_large">
                <c-student-summary
                    student-name="Manjusha"
                    branch="Computer Science and Engineering"
                    cgpa="8.5"
                    onviewprofile={handleViewProfile}>
                </c-student-summary>
            </div>

            <div class="slds-m-top_large">
                <c-eligible-jobs
                    onviewdetails={handleJobDetails}
                    onapply={handleJobApply}>
                </c-eligible-jobs>
            </div>

        </div>

    </lightning-card>
</template>
