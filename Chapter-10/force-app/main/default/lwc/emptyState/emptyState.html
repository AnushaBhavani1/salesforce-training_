<template>
    <div class="slds-box slds-theme_default slds-text-align_center">

        <h2 class="slds-text-heading_medium slds-m-bottom_small">
            {title}
        </h2>

        <p class="slds-m-bottom_medium">
            {message}
        </p>

        <template if:true={actionLabel}>
            <lightning-button
                label={actionLabel}
                variant="brand"
                onclick={handleAction}>
            </lightning-button>
        </template>

    </div>
</template>
