<template>

    <lightning-card title={job.title}>

        <div class="slds-p-around_medium">

            <p>
                <strong>Company:</strong> {job.company}
            </p>

            <p>
                <strong>Location:</strong> {job.location}
            </p>

            <p>
                <strong>Salary:</strong> {job.salary}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    data-id={job.id}
                    onclick={handleViewDetails}>
                </lightning-button>

                <lightning-button
                    label="Apply"
                    variant="brand"
                    data-id={job.id}
                    class="slds-m-left_small"
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
