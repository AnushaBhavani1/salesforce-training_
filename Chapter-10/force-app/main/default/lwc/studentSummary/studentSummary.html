<template>
    <lightning-card title="Student Summary">

        <div class="slds-p-around_medium">

            <p>
                <strong>Name:</strong> {studentName}
            </p>

            <p>
                <strong>Branch:</strong> {branch}
            </p>

            <p>
                <strong>CGPA:</strong> {cgpa}
            </p>

            <lightning-button
                label="View Profile"
                variant="brand"
                class="slds-m-top_medium"
                onclick={handleViewProfile}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
