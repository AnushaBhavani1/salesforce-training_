<template>

    <lightning-card>

        <div class="slds-p-around_large">

            <!-- Institute Logo -->
            <div class="slds-align_absolute-center">
                <img src={logoUrl}
                     alt="Vishnu Logo"
                     class="logo"/>
            </div>

            <br/>

            <!-- Welcome Banner -->
            <div class="banner">
                <h1>Vishnu Placement Portal</h1>
                <p>Welcome to Placement Management System</p>
            </div>

            <br/>

            <!-- Welcome Section -->
            <div class="welcome">
                <h2>Welcome, {studentName}</h2>

                <p>
                    Start your placement journey with top companies.
                </p>

                <p>
                    📅 Today's Date : 31 July 2026
                </p>
            </div>

            <br/>

            <!-- Student Information -->
            <lightning-card title="Student Information" icon-name="standard:person_account">

                <div class="student-card">

                    <p><b>Name :</b> {studentName}</p>

                    <p><b>Roll Number :</b> {rollNumber}</p>

                    <p><b>Department :</b> {department}</p>

                </div>

            </lightning-card>

            <br/>

            <!-- Dashboard -->
            <h2 class="slds-text-heading_medium slds-align_absolute-center">
                Placement Dashboard
            </h2>

            <br/>

            <lightning-layout multiple-rows>

                <lightning-layout-item size="3" padding="around-small">

                    <lightning-card title="Students"
                                    icon-name="standard:people">

                        <div class="cardNumber">
                            250
                        </div>

                    </lightning-card>

                </lightning-layout-item>

                <lightning-layout-item size="3" padding="around-small">

                    <lightning-card title="Companies"
                                    icon-name="standard:account">

                        <div class="cardNumber">
                            25
                        </div>

                    </lightning-card>

                </lightning-layout-item>

                <lightning-layout-item size="3" padding="around-small">

                    <lightning-card title="Jobs"
                                    icon-name="standard:job_position">

                        <div class="cardNumber">
                            63
                        </div>

                    </lightning-card>

                </lightning-layout-item>

                <lightning-layout-item size="3" padding="around-small">

                    <lightning-card title="Applications"
                                    icon-name="standard:file">

                        <div class="cardNumber">
                            5
                        </div>

                    </lightning-card>

                </lightning-layout-item>

            </lightning-layout>

            <br/>

            <!-- Buttons -->

            <div class="button-section">

                <lightning-button
                    label="Show Welcome Message"
                    variant="brand"
                    onclick={showMessage}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Apply"
                    variant="success"
                    onclick={apply}>
                </lightning-button>

            </div>

            <br/>

            <div class="slds-align_absolute-center">

                <p>{message}</p>

            </div>

            <p class="status">

                Status : {status}

            </p>

            <hr/>

            <div class="footer">

                © 2026 Vishnu Institute of Technology

                <br/>

                Placement Management System

            </div>

        </div>

    </lightning-card>

</template>
